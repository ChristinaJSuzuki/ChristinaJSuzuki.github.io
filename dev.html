<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Projects - Christina Suzuki</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quantico:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?dev-refine=3">
</head>

<body class="bg-black text-light text-center page-dev">
    <header class="d-flex align-items-center p-3">
        <nav>
            <ul class="nav nav-pills-container">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link active" href="dev.html">Dev</a></li>
                <li class="nav-item"><a class="nav-link" href="design.html">Design</a></li>
            </ul>
        </nav>
    </header>

    <main class="container dev-main">
        <h1 class="dev-heading">
            <span aria-hidden="true">&lt;</span>
            DEVELOPMENT
            <span aria-hidden="true">/&gt;</span>
        </h1>

        <div class="dev-content">
            <section class="projects-section">
                <h2 class="dev-section-heading">PROJECTS</h2>
                <div class='project-stage'>
                    <div class="project-view">
                        <img id="projectImage" src="./src/devcords.png" alt="Development project preview">
                        <div class="project-nav">
                            <button id="prevBtn" class="arrow" type="button" aria-label="Previous project">&lt;</button>
                            <button id="nextBtn" class="arrow" type="button" aria-label="Next project">&gt;</button>
                        </div>
                    </div>
                </div>
                <p class="project-skills">Full-Stack | Web | Mobile | Game | Software</p>
            </section>
            <section class="stack-section">
                <h2 class="dev-section-heading">TECH STACK</h2>
                <div class="tech-grid">
                    <div class="tech-column">
                        <div class="tech-badge"><img class="tech-icon" src="https://cdn.simpleicons.org/html5/E34F26"
                                alt="" aria-hidden="true"><span class="name">HTML</span></div>
                        <div class="tech-badge"><img class="tech-icon" src="https://cdn.simpleicons.org/css/1572B6"
                                alt="" aria-hidden="true"><span class="name">CSS</span></div>
                        <div class="tech-badge"><img class="tech-icon"
                                src="https://cdn.simpleicons.org/javascript/F7DF1E" alt="" aria-hidden="true"><span
                                class="name">JAVASCRIPT</span></div>
                        <div class="tech-badge"><img class="tech-icon" src="https://cdn.simpleicons.org/react/61DAFB"
                                alt="" aria-hidden="true"><span class="name">REACT</span></div>
                        <div class="tech-badge"><img class="tech-icon" src="https://cdn.simpleicons.org/python/3776AB"
                                alt="" aria-hidden="true"><span class="name">PYTHON</span></div>
                        <div class="tech-badge"><img class="tech-icon"
                                src="https://cdn.simpleicons.org/postgresql/4169E1" alt="" aria-hidden="true"><span
                                class="name">POSTGRESQL</span></div>
                        <div class="tech-badge"><img class="tech-icon" src="https://cdn.simpleicons.org/redux/764ABC"
                                alt="" aria-hidden="true"><span class="name">REDUX</span></div>
                    </div>
                    <div class="tech-column">
                        <div class="tech-badge"><img class="tech-icon"
                                src="https://cdn.simpleicons.org/nodedotjs/5FA04E" alt="" aria-hidden="true"><span
                                class="name">NODE</span></div>
                        <div class="tech-badge"><img class="tech-icon" src="https://cdn.simpleicons.org/swagger/85EA2D"
                                alt="" aria-hidden="true"><span class="name">SWAGGER</span></div>
                        <div class="tech-badge"><img class="tech-icon"
                                src="https://cdn.simpleicons.org/openapiinitiative/6BA539" alt=""
                                aria-hidden="true"><span class="name">OPEN API</span></div>
                        <div class="tech-badge"><img class="tech-icon" src="https://cdn.simpleicons.org/anaconda/44A833"
                                alt="" aria-hidden="true"><span class="name">ANACONDA</span></div>
                        <div class="tech-badge"><img class="tech-icon"
                                src="https://cdn.simpleicons.org/bootstrap/7952B3" alt="" aria-hidden="true"><span
                                class="name">BOOTSTRAP</span></div>
                        <div class="tech-badge"><img class="tech-icon" src="https://cdn.simpleicons.org/flutter/02569B"
                                alt="" aria-hidden="true"><span class="name">FLUTTER</span></div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js" defer></script>

</html>
