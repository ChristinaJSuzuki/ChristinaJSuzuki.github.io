<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Projects - Christina Suzuki</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quantico:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-black text-light text-center page-dev">
    <header class="d-flex align-items-center p-3">
        <div class="logo fs-4 text-uppercase">CS</div>
        <nav>
            <ul class="nav nav-pills-container">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link active" href="dev.html">Dev</a></li>
                <li class="nav-item"><a class="nav-link" href="design.html">Design</a></li>
            </ul>
        </nav>
    </header>

    <main class="container dev-main">
        <h1 class="dev-heading"><span aria-hidden="true">&lt;</span> DEVELOPMENT <span aria-hidden="true">&gt;</span>
        </h1>

        <div class="dev-layout">
            <section class="projects-section">
                <h2 class="dev-section-heading">PROJECTS</h2>
                <div class="project-view">
                    <img id="projectImage" src="./src/devcords.png" alt="Development project preview">
                    <div class="project-nav">
                        <button id="prevBtn" class="arrow" type="button" aria-label="Previous project">&lt;</button>
                        <button id="nextBtn" class="arrow" type="button" aria-label="Next project">&gt;</button>
                    </div>
                </div>
                <p class="project-caption">Full-Stack | Web | Mobile | Game | Software</p>
            </section>
            <section class="stack-section">
                <h2 class="dev-section-heading">TECH STACK</h2>
                <div class="tech-badges">
                    <div class="tech-badge"><span class="tech-icon">&lt;/&gt;</span><span class="name">HTML</span></div>
                    <div class="tech-badge"><span class="tech-icon">N</span><span class="name">NODE</span></div>
                    <div class="tech-badge"><span class="tech-icon">#</span><span class="name">CSS</span></div>
                    <div class="tech-badge"><span class="tech-icon">S</span><span class="name">SWAGGER</span></div>
                    <div class="tech-badge"><span class="tech-icon">JS</span><span class="name">JAVASCRIPT</span></div>
                    <div class="tech-badge"><span class="tech-icon">API</span><span class="name">OPEN API</span></div>
                    <div class="tech-badge"><span class="tech-icon">R</span><span class="name">REACT</span></div>
                    <div class="tech-badge"><span class="tech-icon">A</span><span class="name">ANACONDA</span></div>
                    <div class="tech-badge"><span class="tech-icon">Py</span><span class="name">PYTHON</span></div>
                    <div class="tech-badge"><span class="tech-icon">B</span><span class="name">BOOTSTRAP</span></div>
                    <div class="tech-badge"><span class="tech-icon">DB</span><span class="name">POSTGRESQL</span></div>
                    <div class="tech-badge"><span class="tech-icon">F</span><span class="name">FLUTTER</span></div>
                    <div class="tech-badge"><span class="tech-icon">↻</span><span class="name">REDUX</span></div>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js" defer></script>
