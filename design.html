<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Work - Christina Suzuki</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quantico:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="theme-light text-center page-design">
    <header class="d-flex align-items-center p-3">
        <nav>
            <ul class="nav nav-pills-container">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link" href="dev.html">Dev</a></li>
                <li class="nav-item"><a class="nav-link active" href="design.html">Design</a></li>
            </ul>
        </nav>
    </header>

    <main class="container design-main">
        <div class="design-frame">
            <h1 class="design-heading">
                <span aria-hidden="true">&lt;</span>
                DESIGN
                <span aria-hidden="true">/&gt;</span>
            </h1>

            <section class="design-gallery-intro">
                <h2 class="design-gallery-title">
                    Pick a machine. Release a design.
                </h2>

                <p class="design-gallery-description">
                    Choose a capsule machine to reveal a design project.
                </p>
            </section>

            <section class="design-machine-stage" aria-label="Design capsule machines">
                <div class="design-machine-wrap">
                    <img class="design-machines" src="./src/gachapon.png" alt="Four colorful capsule machines">

                    <!-- BLUE MACHINE -->
                    <button class="design-machine-hitbox design-machine-hitbox--blue-top" type="button"
                        aria-label="View Chocolati project">
                        <img src="./src/project-1-thumbnail.jpg" alt="">
                    </button>

                    <button class="design-machine-hitbox design-machine-hitbox--blue-bottom" type="button"
                        aria-label="View Chocolati labels">
                        <img src="./src/project-2-thumbnail.jpg" alt="">
                    </button>

                    <!-- GREEN MACHINE -->
                    <button class="design-machine-hitbox design-machine-hitbox--green-top" type="button"
                        aria-label="View SaaS dashboard">
                        <img src="./src/project-3-thumbnail.jpg" alt="">
                    </button>

                    <button class="design-machine-hitbox design-machine-hitbox--green-bottom" type="button"
                        aria-label="View Brown Card prototype">
                        <img src="./src/project-4-thumbnail.png" alt="">
                    </button>

                    <!-- ORANGE MACHINE -->
                    <button class="design-machine-hitbox design-machine-hitbox--orange-top" type="button"
                        aria-label="View Quiri Website Design">
                        <img src="./src/project-5-thumbnail.jpg" alt="">
                    </button>

                    <button class="design-machine-hitbox design-machine-hitbox--orange-bottom" type="button"
                        aria-label="View Moon & Sun Switch">
                        <img src="./src/project-6-thumbnail.png" alt="">
                    </button>

                    <!-- PINK MACHINE -->
                    <button class="design-machine-hitbox design-machine-hitbox--pink-top" type="button"
                        aria-label="View Artistic Design">
                        <img src="./src/project-7-thumbnail.jpg" alt="">
                    </button>

                    <button class="design-machine-hitbox design-machine-hitbox--pink-bottom" type="button"
                        aria-label="View 3D Design">
                        <img src="./src/project-8-thumbnail.png" alt="">
                    </button>
                </div>
            </section>
            <!-- CAPSULE REVEAL ANIMATION -->
            <!-- CAPSULE REVEAL ANIMATION -->
            <div class="capsule-animation-overlay" id="capsuleAnimationOverlay" hidden aria-hidden="true">
                <div class="capsule-animation-stage">

                    <div class="capsule-animation-shell">

                        <img src="./src/capsule.png" alt="" class="capsule-animation-image capsule-half-top"
                            id="capsuleAnimationImage">

                        <img src="./src/capsule.png" alt="" class="capsule-animation-image capsule-half-bottom">

                    </div>

                    <div class="capsule-animation-flash"></div>

                </div>
            </div>

            <!-- DESIGN PROJECT REVEAL -->
            <div class="design-project-overlay" id="designProjectOverlay" hidden>
                <div class="design-project-panel" role="dialog" aria-modal="true" aria-labelledby="designProjectTitle">
                    <button class="design-project-close" id="designProjectClose" type="button"
                        aria-label="Close project">
                        &times;
                    </button>

                    <h2 id="designProjectTitle">Project Coming Soon</h2>

                    <div class="design-project-content">

                        <!-- Left: Project Image -->

                        <div class="design-project-image">
                            <video id="designProjectVideo" class="design-project-video" controls muted loop playsinline
                                preload="metadata">
                                <source src="./src/chocolati-designs.mp4" type="video/mp4" />
                                Your browser does not support HTML5 video.
                            </video>
                        </div>

                        <!-- Right: Project Information -->
                        <div class="design-project-info">
                            <div class="design-project-detail">
                                <h3>CATEGORY</h3>
                                <p id="designProjectCategory">Coming Soon</p>
                            </div>

                            <div class="design-project-detail">
                                <h3>TOOLS</h3>
                                <p id="designProjectTools">Coming Soon</p>
                            </div>

                            <div class="design-project-detail">
                                <h3>DESCRIPTION</h3>
                                <p id="designProjectDescription">
                                    Design project will appear here!
                                </p>
                            </div>

                            <a id="designProjectLink" href="#" target="_blank" rel="noopener noreferrer" hidden>
                                VIEW ON BEHANCE
                            </a>
                        </div>

                    </div>

                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./capsule-gallery.js" defer></script>
</body>

</html>
