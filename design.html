<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Work - Christina Suzuki</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quantico:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="theme-light text-center page-design">
    <header class="d-flex align-items-center p-3">
        <nav>
            <ul class="nav nav-pills-container">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link" href="dev.html">Dev</a></li>
                <li class="nav-item"><a class="nav-link active" href="design.html">Design</a></li>
            </ul>
        </nav>
    </header>

    <main class="container design-main">
        <div class="design-frame">
            <h1 class="design-heading">
                <span aria-hidden="true">&lt;</span>
                DESIGN
                <span aria-hidden="true">/&gt;</span>
            </h1>

            <section class="design-gallery-intro">
                <h2 class="design-gallery-title">
                    Pick a machine. Release a design.
                </h2>

                <p class="design-gallery-description">
                    Choose a capsule machine to reveal a design project.
                </p>
            </section>

            <section class="design-machine-stage" aria-label="Design capsule machines">
                <div class="design-machine-wrap">
                    <img class="design-machines" src="./src/gachapon.png" alt="Four colorful capsule machines">

                    <!-- BLUE MACHINE -->
                    <button class="design-machine-hitbox design-machine-hitbox--blue-top" type="button"
                        aria-label="View blue machine project 1"></button>

                    <button class="design-machine-hitbox design-machine-hitbox--blue-bottom" type="button"
                        aria-label="View blue machine project 2"></button>

                    <!-- GREEN MACHINE -->
                    <button class="design-machine-hitbox design-machine-hitbox--green-top" type="button"
                        aria-label="View green machine project 1"></button>

                    <button class="design-machine-hitbox design-machine-hitbox--green-bottom" type="button"
                        aria-label="View green machine project 2"></button>

                    <!-- ORANGE MACHINE -->
                    <button class="design-machine-hitbox design-machine-hitbox--orange-top" type="button"
                        aria-label="View orange machine project 1"></button>

                    <button class="design-machine-hitbox design-machine-hitbox--orange-bottom" type="button"
                        aria-label="View orange machine project 2"></button>

                    <!-- PINK MACHINE -->
                    <button class="design-machine-hitbox design-machine-hitbox--pink-top" type="button"
                        aria-label="View pink machine project 1"></button>

                    <button class="design-machine-hitbox design-machine-hitbox--pink-bottom" type="button"
                        aria-label="View pink machine project 2"></button>
                </div>
            </section>
            <!-- DESIGN PROJECT REVEAL -->
            <div class="design-project-overlay" id="designProjectOverlay" hidden>
                <div class="design-project-panel" role="dialog" aria-modal="true" aria-labelledby="designProjectTitle">
                    <button class="design-project-close" id="designProjectClose" type="button"
                        aria-label="Close project">
                        &times;
                    </button>

                    <h2 id="designProjectTitle">Project Coming Soon</h2>

                    <p id="designProjectDescription">
                        Your design project will appear here!
                    </p>

                    <a id="designProjectLink" href="#" target="_blank" rel="noopener noreferrer" hidden>
                        VIEW PROJECT
                    </a>

                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./capsule-gallery.js" defer></script>
</body>

</html>
